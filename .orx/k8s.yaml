apiVersion: batch/v1
kind: Job
metadata:
  name: mva-{{ORX_RUN}}
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: run
          image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
          command:
            - bash
            - -c
            - |
              set -e
              apt-get update -qq >/dev/null
              apt-get install -y -qq git git-lfs ffmpeg libgl1 libglib2.0-0 curl >/dev/null
              exec bash -c "$ORX_SCRIPT"
          resources:
            requests:
              nvidia.com/gpu: "8"
              cpu: "100"
              memory: "800Gi"
            limits:
              nvidia.com/gpu: "8"
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: scratch
              mountPath: /scratch
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: mva-shared
        - name: scratch
          emptyDir:
            sizeLimit: 300Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
